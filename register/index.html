<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Registro - Mis Finanzas</title>
    <link rel="stylesheet" href="../assets/css/auth.css">
</head>
<body>
    <div class="auth-wrapper">
        <div class="card auth-card">
            <h1 class="text-center" style="color: var(--accent); font-size: 1.2rem; letter-spacing: 3px; margin-bottom: 5px; border-bottom: none;">FINANZAS</h1>
            <h2 class="text-center mb-2" style="border-bottom: none; font-size: 2rem; color: #ffffff;">Crear Cuenta</h2>
            <div class="input-group">
                <input type="text" id="reg-user" placeholder="Usuario (Ej: JuanPerez)">
            </div>
            <div class="input-group">
                <input type="email" id="reg-email" placeholder="Correo electrónico">
            </div>
            <div class="input-group" style="position: relative;">
                <input type="password" id="reg-pass" placeholder="Contraseña">
                <button type="button" onclick="togglePassword('reg-pass', this)" style="position: absolute; right: 15px; top: 50%; transform: translateY(-50%); background: none; border: none; color: #777; cursor: pointer; padding: 0; display: flex; align-items: center; justify-content: center;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                </button>
            </div>
            <button class="btn btn-primary" onclick="registrarUsuario()">Registrarme</button>
            <div class="separator">O</div>
            <button class="btn btn-secondary" onclick="window.location.href='../login/'">Volver al Login</button>
        </div>
    </div>
    <script src="../assets/js/auth.js"></script>
    <script>
        function togglePassword(inputId, btn) {
            const input = document.getElementById(inputId);
            const iconEye = `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>`;
            const iconEyeOff = `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>`;
            if (input.type === "password") { input.type = "text"; btn.innerHTML = iconEyeOff; } else { input.type = "password"; btn.innerHTML = iconEye; }
        }
    </script>
</body>
</html>
